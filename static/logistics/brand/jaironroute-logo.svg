  <line x1="175" y1="162" x2="445" y2="162" stroke="#2E75B6" stroke-width="2" stroke-linecap="round" fill="none" mask="url(#imagine-text-gaps-skn556)" style="fill:none;stroke:rgb(46, 117, 182);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Punto acento en la línea -->
