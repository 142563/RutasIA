    <line x1="75" y1="65" x2="100" y2="120" stroke="#2E5496" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none" style="fill:none;stroke:rgb(46, 84, 150);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-dasharray:4px, 3px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <line x1="100" y1="120" x2="165" y2="110" stroke="#2E5496" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none" style="fill:none;stroke:rgb(46, 84, 150);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-dasharray:4px, 3px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

