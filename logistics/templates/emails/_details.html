{% comment %}
 Tarjeta de datos (código, dirección, ventana de llegada…).
 Uso: {% include "emails/_details.html" with rows=details %}  donde details = [("Pedido", "PED-…"), …]
{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:6px 0 4px;background:#f8f8f6;border:1px solid #ececea;border-radius:10px">
  {% for label, value in rows %}
  <tr>
    <td style="padding:{% if forloop.first %}14px{% else %}8px{% endif %} 16px {% if forloop.last %}14px{% else %}0{% endif %};font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#6b6f76;width:38%;vertical-align:top">{{ label }}</td>
    <td style="padding:{% if forloop.first %}14px{% else %}8px{% endif %} 16px {% if forloop.last %}14px{% else %}0{% endif %} 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#111113;vertical-align:top">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
