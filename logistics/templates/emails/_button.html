{# Botón "a prueba de clientes de correo": tabla con fondo + enlace con padding #}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0 0"><tr>
  <td style="background:#111113;border-radius:10px">
    <a href="{{ url }}" style="display:inline-block;padding:13px 22px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px">{{ label }}</a>
  </td>
</tr></table>
