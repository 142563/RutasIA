<!doctype html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
{# Solo claro: así Gmail/Outlook no invierten colores a medias en modo oscuro #}
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{% block title %}{{ subject }}{% endblock %}</title>
</head>
{% comment %}
 Correo transaccional de enruta. Tablas y estilos en línea porque los clientes de correo
 ignoran el CSS externo y la mayoría del <style>. Bloques que llena cada correo:
   preheader (texto de la bandeja) · status (etiqueta) · heading · lead · body · action · reason
 Piezas reutilizables: emails/_steps.html (avance del envío), emails/_details.html (tabla de datos),
 emails/_button.html (botón principal).
{% endcomment %}
<body style="margin:0;padding:0;background:#f3f3f1;-webkit-text-size-adjust:100%">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f3f3f1;font-size:1px;line-height:1px">{% block preheader %}{% endblock %}&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;&#8204;&nbsp;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f3f1">
  <tr><td align="center" style="padding:32px 12px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px">

      {# Marca #}
      <tr><td style="padding:0 4px 18px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="width:30px;height:30px;background:#111113;border-radius:8px;text-align:center;vertical-align:middle">
            <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ea580c"></span>
          </td>
          <td style="padding-left:10px;font-size:17px;font-weight:700;letter-spacing:-0.2px;color:#111113">enruta</td>
        </tr></table>
      </td></tr>

      {# Tarjeta principal #}
      <tr><td style="background:#ffffff;border:1px solid #e4e4e0;border-radius:14px;overflow:hidden">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr><td style="height:4px;background:{% block accent %}#2563eb{% endblock %};font-size:0;line-height:0">&nbsp;</td></tr>
          <tr><td style="padding:28px 32px 8px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#111113">
            {% block status_wrap %}{% if status_label %}<span style="display:inline-block;padding:4px 10px;border-radius:999px;background:#f1f1ee;color:#3f4147;font-size:12px;font-weight:600;letter-spacing:0.2px;text-transform:uppercase">{{ status_label }}</span>{% endif %}{% endblock %}
            <h1 style="margin:14px 0 8px;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-0.3px;color:#111113">{% block heading %}{% endblock %}</h1>
            <p style="margin:0 0 4px;font-size:15px;line-height:1.6;color:#3f4147">{% block lead %}{% endblock %}</p>
          </td></tr>
          <tr><td style="padding:12px 32px 4px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#2b2b30">
            {% block body %}{% endblock %}
          </td></tr>
          <tr><td style="padding:4px 32px 30px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
            {% block action %}{% endblock %}
          </td></tr>
        </table>
      </td></tr>

      {# Pie #}
      <tr><td style="padding:20px 8px 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b6f76;text-align:center">
        <p style="margin:0 0 6px">{% block reason %}Recibes este correo porque tienes un envío o una cuenta en enruta.{% endblock %}</p>
        <p style="margin:0 0 6px">Es un aviso automático; por favor no respondas a este correo.</p>
        <p style="margin:0"><a href="{{ site_url }}" style="color:#6b6f76;text-decoration:underline">enruta.world</a> · Ruteo inteligente con tráfico para paquetería en Guatemala</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
