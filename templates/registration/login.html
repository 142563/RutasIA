{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rutas A* | Iniciar sesión</title>
    <script>
        // Mismo criterio que index.html: el tema se fija antes del primer render.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) {}
            var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
        })();
    </script>
    <link rel="stylesheet" href="{% static 'logistics/style.css' %}">
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .login-box {
            width: min(360px, 100%);
            display: grid;
            gap: 1.25rem;
            padding: 1.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .brand {
            display: grid;
            justify-items: center;
            gap: 0.5rem;
            text-align: center;
        }

        .brand .brand-logo {
            width: 150px;
            height: auto;
        }

        .brand .subtitle {
            color: var(--text-muted);
            font-size: var(--fs-sm);
        }

        .error-box {
            padding: 0.625rem 0.75rem;
            border: 1px solid var(--danger);
            border-radius: var(--radius);
            background: var(--danger-weak);
            color: var(--danger);
            font-size: var(--fs-sm);
        }

        .login-box button[type="submit"] {
            justify-self: stretch;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand">
            <img class="brand-logo" src="{% static 'logistics/brand/rutas_astar_logo_logistica_gt.svg' %}" alt="Rutas A*">
            <p class="chip">Sistema Web de Distribución</p>
            <p class="subtitle">Ingresa tus credenciales para continuar</p>
        </div>

        {% if form.errors %}
        <div class="error-box">
            Usuario o contraseña incorrectos. Intenta de nuevo.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label>Usuario
                <input type="text" name="username" autofocus autocomplete="username" required>
            </label>
            <label>Contraseña
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn-primary">Iniciar sesión</button>
        </form>
    </div>
</body>
</html>
