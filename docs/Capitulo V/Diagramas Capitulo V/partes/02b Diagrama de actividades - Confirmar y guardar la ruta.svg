"/><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="326.5381" x="561.4212" y="923.9807">Rechazar con el motivo</text><ellipse cx="724.6902" cy="1082.9453" fill="none" rx="34.375" ry="34.375" style="stroke:#222222;stroke-width:3.125;"/><ellipse cx="724.6902" cy="1082.9453" fill="#222222" rx="18.75" ry="18.75" style="stroke:#222222;stroke-width:3.125;"/><polygon fill="#FFFFFF" points="575.3067,713.4186,874.0738,713.4186,911.5738,750.9186,874.0738,788.4186,575.3067,788.4186,537.8067,750.9186,575.3067,713.4186" style="stroke:#1F3A5F;stroke-width:1.5625;"/><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="34.7595" x="737.1902" y="817.7307">no</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="298.7671" x="575.3067" y="744.2963">&#191;Capacidad y horario</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="173.7366" x="575.3067" y="780.2307">disponibles?</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="24.3073" x="911.5738" y="744.2963">s&#237;</text><rect fill="#F5F5F5" height="170.3033" rx="9.375" ry="9.375" style="stroke:#1F3A5F;stroke-width:1.5625;" width="354.2938" x="547.5433" y="1481.3736"/><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="291.7938" x="578.7933" y="1541.9357">Guardar la ruta y sus</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="239.7614" x="578.7933" y="1577.8702">paradas; pedidos</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="281.4941" x="578.7933" y="1613.8046">pasan a &#171;asignado&#187;</text><rect fill="#F5F5F5" height="170.3033" rx="9.375" ry="9.375" style="stroke:#1F3A5F;stroke-width:1.5625;" width="456.7413" x="496.3196" y="1714.1769"/><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="369.9493" x="527.5696" y="1774.7391">Avisar por correo al cliente</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="394.2413" x="527.5696" y="1810.6735">y al conductor tras confirmar</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="192.8101" x="527.5696" y="1846.608">la transacci&#243;n</text><path d="M821.5652,1915.7303 L821.5652,1972.757 L759.0652,1985.257 L821.5652,1997.757 L821.5652,2054.7836 A0,0 0 0 0 821.5652,2054.7836 L1236.3876,2054.7836 A0,0 0 0 0 1236.3876,2054.7836 L1236.3876,1946.9803 L1205.1376,1915.7303 L821.5652,1915.7303 A0,0 0 0 0 821.5652,1915.7303 " fill="#F5F5F5" style="stroke:#7A7A7A;stroke-width:1.5625;"/><path d="M1205.1376,1915.7303 L1205.1376,1946.9803 L1236.3876,1946.9803 L1205.1376,1915.7303 " fill="#F5F5F5" style="stroke:#7A7A7A;stroke-width:1.5625;"/><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="349.1974" x="840.3152" y="1960.6674">Avisos: detallado en 01e.</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="262.3291" x="840.3152" y="1996.6019">La ejecuci&#243;n por el</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="342.2394" x="840.3152" y="2032.5363">mensajero sigue en 02d.</text><ellipse cx="724.6902" cy="1985.257" fill="none" rx="34.375" ry="34.375" style="stroke:#222222;stroke-width:3.125;"/><ellipse cx="724.6902" cy="1985.257" fill="#222222" rx="18.75" ry="18.75" style="stroke:#222222;stroke-width:3.125;"/><line style="stroke:#7A7A7A;stroke-width:4.6875;" x1="477.5696" x2="477.5696" y1="143.1213" y2="2054.7836"/><rect fill="#F5F5F5" height="170.3033" rx="9.375" ry="9.375" style="stroke:#1F3A5F;stroke-width:1.5625;" width="362.9913" x="1270.7626" y="1248.5703"/><text fill="#000000" font-family="Arial" font-size="31.25" l