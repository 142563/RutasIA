services:
  # Servicio web principal (ya configurado)
  - type: web
    name: rutasia
    runtime: python
    # Primero se compila la aplicación React (frontend/dist) y luego collectstatic la publica.
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn rutasia.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Sin esta variable el template renderiza el mapa sin API key y
      # Google responde InvalidKeyMapError.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: DEBUG
        value: "False"
