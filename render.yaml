services:
  # Servicio web principal (ya configurado)
  - type: web
    name: rutasia
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn rutasia.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: DEBUG
        value: "False"

  # Cron Job: sincroniza precios de combustible cada lunes a las 06:00 GT (UTC-6 → 12:00 UTC)
  - type: cron
    name: sync-fuel-prices
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 12 * * 1"
    startCommand: python manage.py sync_fuel_prices
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
